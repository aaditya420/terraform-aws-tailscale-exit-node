name: Lint & Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.5"
      - name: terraform fmt -check
        working-directory: .
        # On failure, name each unformatted file as an annotation so it shows on the pull request.
        run: |
          if ! terraform fmt -check -recursive -diff; then
            terraform fmt -check -recursive -list=true | while read -r f; do
              d=$(terraform fmt -check -diff "${f}" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
              echo "::error file=${f},title=terraform fmt::${d}"
            done
            exit 1
          fi

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.5"
      - run: terraform init -backend=false
      - run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      # Only lint the module root — test scenarios are fixture files, not module code
      - run: tflint

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false
          # Without a token the action's download of tfsec hits GitHub's API rate limit.
          github_token: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_8,CKV2_AWS_41
          # Test scenario files use relative module sources that checkov can't parse
          skip_path: tests/,examples/

  docs-check:
    name: terraform-docs up-to-date
    runs-on: ubuntu-latest
    # Only check on PRs — direct pushes to main race with docs.yml auto-commit
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-docs/gh-actions@v1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: true
